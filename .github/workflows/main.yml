name: Unit Tests and Coverage

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ROB_REMOTE_USER }}
          password: ${{ secrets.ROB_REMOTE_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create empty config files
        run: |
          touch config-3.py
          touch config.py

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag robot_image

      - name: Run unit tests and coverage in Docker container
        run: |
          docker run --name coverage_container robot_image sh -c "cd /app && xvfb-run --auto-servernum --server-num=99 python -m coverage run --rcfile=.coveragerc -m unittest discover -v && python -m coverage xml --rcfile=.coveragerc -o coverage.xml && python -m coverage html --rcfile=.coveragerc -d htmlcov && python -m coverage report --rcfile=.coveragerc"
          docker cp coverage_container:/app/coverage.xml ./coverage.xml
          docker cp coverage_container:/app/htmlcov ./htmlcov
          docker cp coverage_container:/app/.coverage ./.coverage
          docker rm coverage_container

      - name: Fix coverage paths
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('.coverage')
          c = conn.cursor()
          c.execute('UPDATE file SET path = REPLACE(path, \"/app/\", \"\")')
          c.execute('UPDATE file SET path = REPLACE(path, \"/home/runner/work/Robot_Remote_Control/Robot_Remote_Control/\", \"\")')
          conn.commit()
          conn.close()
          "

      - name: Generate coverage report
        run: |
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Percentage |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------------|" >> $GITHUB_STEP_SUMMARY
          python -m coverage report | tail -n 1 | awk '{print "| Total | " $4 " |"}' >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        run: |
          python -m coverage report --fail-under=80

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            .coverage
          retention-days: 14