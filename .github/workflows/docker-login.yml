# .github/workflows/docker-login.yml
name: Docker Login

on:
  workflow_call:
    secrets:
      ROB_REMOTE_USER:
        required: true
      ROB_REMOTE_TOKEN:
        required: true

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ROB_REMOTE_USER }}
          password: ${{ secrets.ROB_REMOTE_TOKEN }}