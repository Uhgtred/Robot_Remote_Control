name: Unit Tests and Coverage

on: [push, pull_request, workflow_dispatch]

jobs:

#  call-docker-login:
#    uses: ./.github/workflows/docker-login.yml

  login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ROB_REMOTE_USER }}
          password: ${{ secrets.ROB_REMOTE_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Build Docker image
        run: docker build . --file Dockerfile --tag robot_image

      - name: Run unit tests and coverage in Docker container
        run: |
          docker run --name coverage_container robot_image sh -c "cd /app && \
          PYTHONPATH=/app \
          xvfb-run --auto-servernum --server-num=99 \
          python -m coverage run --branch --source=/app --rcfile=.coveragerc \
          -m unittest discover -v -s BusTransactions/UnitTests -p 'test_*.py' && \
          coverage xml -o coverage.xml"

      - name: Copy coverage report
        run: : docker cp coverage_container:/app/coverage.xml coverage.xml